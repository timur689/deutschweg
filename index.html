<meta name="description" content="Немецкий с нуля до B1: уроки, правила, методичка, словарь и повторение.">

<style>
/* Layout: one calm column of frosted-glass panels over a dim room lit by three soft lamps,
   one per article colour (der blue, die rose, das green). No borders, soft radii, soft shadows. */
:root {
  --bg: #ECEEF3; --bg-2: #DDE2EC; --bg-78: rgba(236,238,243,.78); --bg-72: rgba(236,238,243,.72); --bg-86: rgba(236,238,243,.86);
  --glass: rgba(255,255,255,.62); --glass-strong: rgba(255,255,255,.86); --glass-soft: rgba(255,255,255,.40); --glass-solid: #F7F8FB;
  --line: rgba(20,24,34,.08);
  --ink: #141822; --muted: #586072; --faint: #8B92A2;
  --solid: #141822; --on-solid: #F8F9FC;
  --der: #2C59D6; --die: #CF3658; --das: #128E61;
  --der-glow: rgba(64,108,240,.40); --die-glow: rgba(232,82,124,.28); --das-glow: rgba(36,178,118,.24);
  --gold: #E89B2C; --gold-glow: rgba(240,166,60,.35);
  --ok: #128E61; --bad: #CF3658;
  --shadow: 0 1px 2px rgba(20,30,60,.05), 0 14px 34px rgba(30,40,80,.10);
  --shadow-lift: 0 2px 4px rgba(20,30,60,.06), 0 22px 48px rgba(30,40,80,.16);
  --blur: blur(22px) saturate(160%);
  --r: 24px; --r-s: 16px; --gap: 12px; --nav-h: 68px;
  --font-display: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-ui: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --spring: cubic-bezier(.34, 1.4, .64, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0C11; --bg-2: #12151D; --bg-78: rgba(10,12,17,.78); --bg-72: rgba(10,12,17,.72); --bg-86: rgba(10,12,17,.86);
    --glass: rgba(255,255,255,.065); --glass-strong: rgba(255,255,255,.12); --glass-soft: rgba(255,255,255,.04); --glass-solid: #191C24;
    --line: rgba(255,255,255,.08);
    --ink: #EEF1F7; --muted: #B3BACA; --faint: #7B8293;
    --solid: #EEF1F7; --on-solid: #0F1218;
    --der: #87A7FF; --die: #FF7E98; --das: #4FD49B;
    --der-glow: rgba(90,130,255,.30); --die-glow: rgba(255,90,130,.18); --das-glow: rgba(60,210,140,.15);
    --gold: #F5B451; --gold-glow: rgba(245,170,70,.28);
    --ok: #4FD49B; --bad: #FF7E98;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px rgba(0,0,0,.45);
    --shadow-lift: 0 2px 4px rgba(0,0,0,.35), 0 24px 56px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0C11; --bg-2: #12151D; --bg-78: rgba(10,12,17,.78); --bg-72: rgba(10,12,17,.72); --bg-86: rgba(10,12,17,.86);
  --glass: rgba(255,255,255,.065); --glass-strong: rgba(255,255,255,.12); --glass-soft: rgba(255,255,255,.04); --glass-solid: #191C24;
  --line: rgba(255,255,255,.08);
  --ink: #EEF1F7; --muted: #B3BACA; --faint: #7B8293;
  --solid: #EEF1F7; --on-solid: #0F1218;
  --der: #87A7FF; --die: #FF7E98; --das: #4FD49B;
  --der-glow: rgba(90,130,255,.30); --die-glow: rgba(255,90,130,.18); --das-glow: rgba(60,210,140,.15);
  --gold: #F5B451; --gold-glow: rgba(245,170,70,.28);
  --ok: #4FD49B; --bad: #FF7E98;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px rgba(0,0,0,.45);
  --shadow-lift: 0 2px 4px rgba(0,0,0,.35), 0 24px 56px rgba(0,0,0,.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-ui); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
::selection { background: var(--der-glow); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--der); outline-offset: 3px; border-radius: 10px; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 800; letter-spacing: -0.025em; line-height: 1.12; text-wrap: balance; }
h1 { font-size: clamp(26px, 5vw, 34px); } h2 { font-size: 21px; } h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.eyebrow { font: 700 12px/1.3 var(--font-display); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.num { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.04em; }

/* ---------- the room: three article lamps drifting behind the glass ---------- */
.ambient { position: fixed; inset: -20vmax; z-index: -1; pointer-events: none;
  background:
    radial-gradient(36vmax 32vmax at 80% 18%, var(--der-glow), transparent 70%),
    radial-gradient(30vmax 26vmax at 12% 72%, var(--die-glow), transparent 70%),
    radial-gradient(28vmax 24vmax at 58% 96%, var(--das-glow), transparent 70%),
    radial-gradient(60vmax 50vmax at 50% 50%, var(--bg-2), transparent 75%);
  animation: drift 40s ease-in-out infinite alternate; }
@keyframes drift { 0% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(-4vmax,3vmax,0) scale(1.06); } 100% { transform: translate3d(3vmax,-2vmax,0) scale(.98); } }

/* ---------- layout ---------- */
.app { max-width: 760px; margin: 0 auto; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(var(--nav-h) + 44px + env(safe-area-inset-bottom, 0px)); }
#app { display: flex; flex-direction: column; gap: 16px; padding-top: 6px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.panel, .card, .pane { position: relative; min-width: 0; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.panel { padding: 22px 20px; }
.pane { padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.pane > :not(.fill) { position: relative; z-index: 1; }
.pane-title { font: 700 13px/1.3 var(--font-display); color: var(--muted); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 64px; margin: 0 -14px; padding: 14px 16px 22px; margin-bottom: -10px; background: var(--bg-78);
  -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%);
  -webkit-mask-image: linear-gradient(#000 76%, transparent); mask-image: linear-gradient(#000 76%, transparent); }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; min-width: 0; }
.brand b { display: block; font: 800 19px/1.15 var(--font-display); letter-spacing: -0.02em; }
.brand small { display: block; font-size: 12px; color: var(--muted); }
.orb { width: 34px; height: 34px; flex: none; border-radius: 50%; position: relative;
  background: conic-gradient(from 210deg, var(--der), var(--die), var(--das), var(--der)); animation: breathe 6s ease-in-out infinite; }
.orb::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--bg); opacity: .85; }
@keyframes breathe { 0%, 100% { box-shadow: 0 0 0 5px rgba(120,140,255,.10), 0 0 20px 2px var(--der-glow); } 50% { box-shadow: 0 0 0 8px rgba(120,140,255,.06), 0 0 30px 8px var(--die-glow); } }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); display: inline-block; }
.sync.on i { background: var(--das); box-shadow: 0 0 8px var(--das); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 20px; min-height: 46px; border: 0; border-radius: 999px;
  background: var(--glass-strong); color: var(--ink); font: 700 15px/1.1 var(--font-display); text-decoration: none; box-shadow: var(--shadow);
  transition: transform .35s var(--spring), box-shadow .35s var(--ease), background-color .3s var(--ease); }
.btn:hover { box-shadow: var(--shadow-lift); }
.btn:active { transform: scale(.96); }
.btn.primary { background: var(--solid); color: var(--on-solid); }
.btn.mark { background: linear-gradient(135deg, #FFE3B0, var(--gold) 60%, #DE7E3B); color: #2A1704; box-shadow: 0 10px 28px var(--gold-glow); }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.ghost:hover { background: var(--glass-soft); }
.btn.small { padding: 9px 14px; min-height: 38px; font-size: 13px; }
.btn:disabled { background: var(--glass-soft); color: var(--faint); box-shadow: none; cursor: default; transform: none; }
.btn svg { width: 18px; height: 18px; flex: none; }
.icon-btn { width: 36px; height: 36px; flex: none; border: 0; border-radius: 50%; background: var(--glass-strong); box-shadow: var(--shadow); color: var(--ink);
  display: inline-grid; place-items: center; transition: transform .35s var(--spring); }
.icon-btn:active { transform: scale(.9); }
.icon-btn svg { width: 16px; height: 16px; }
input[type="search"], select, .type-row input { border: 0; border-radius: 14px; background: var(--glass-soft); box-shadow: inset 0 0 0 1px var(--line); padding: 12px 14px; min-height: 46px; color: var(--ink); transition: box-shadow .25s var(--ease), background-color .25s var(--ease); }
input:focus, select:focus { outline: none; background: var(--glass-strong); box-shadow: inset 0 0 0 1.5px var(--der), 0 0 0 4px var(--der-glow); }
::placeholder { color: var(--faint); opacity: 1; }

/* articles */
.a-der, .art-der { color: var(--der); } .a-die, .art-die { color: var(--die); } .a-das, .art-das { color: var(--das); }
.art-der, .art-die, .art-das { font-weight: 700; }
.wd { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.01em; }
.wd .a { font-weight: 800; }

/* ---------- home wall ---------- */
.hero { padding: 24px 22px; display: flex; flex-direction: column; gap: 16px;
  background: linear-gradient(135deg, rgba(255,255,255,.18), transparent 60%), var(--glass); }
.hero h1 { font-size: clamp(28px, 6vw, 38px); }
.hero-steps { display: flex; gap: 6px; flex-wrap: wrap; }
.hero-steps span { font: 700 12px var(--font-display); padding: 5px 11px; border-radius: 999px; background: var(--glass-soft); color: var(--muted); }
.hero-steps span.on { background: var(--solid); color: var(--on-solid); }
.wall { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
.wall .pane { min-height: 132px; justify-content: space-between; }
.big { font-size: clamp(38px, 9vw, 52px); line-height: .9; }
.big small { font: 600 13px var(--font-ui); letter-spacing: 0; color: var(--muted); margin-left: 4px; }
.fill { position: absolute; inset: 0; z-index: 0; pointer-events: none; clip-path: inset(calc(100% - var(--fill, 0%)) 0 0 0); transition: clip-path 1s var(--ease); background: var(--fill-c); }
body.boot .fill { animation: rise 1.6s var(--ease) both; }
@keyframes rise { from { clip-path: inset(100% 0 0 0); } }
.f-gold { --fill-c: linear-gradient(to top, var(--gold-glow), rgba(255,210,140,.10) 80%, transparent); }
.f-der { --fill-c: linear-gradient(to top, var(--der-glow), rgba(120,150,255,.08) 80%, transparent); }
.f-das { --fill-c: linear-gradient(to top, var(--das-glow), rgba(80,210,150,.08) 80%, transparent); }
.flame { width: 26px; height: 26px; color: var(--gold); filter: drop-shadow(0 0 8px var(--gold-glow)); }
.cta-due { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 22px; border: 0; border-radius: 999px; width: 100%; text-align: left;
  background: linear-gradient(135deg, #FFE7BD, var(--gold) 55%, #DE7E3B); color: #2A1704; font: 800 18px var(--font-display); letter-spacing: -0.01em; text-decoration: none;
  box-shadow: 0 10px 30px var(--gold-glow), 0 2px 6px rgba(120,60,10,.22); animation: glow 4.5s ease-in-out infinite; transition: transform .4s var(--spring); }
.cta-due small { display: block; font: 600 13px var(--font-ui); opacity: .8; }
.cta-due svg { width: 26px; height: 26px; flex: none; }
.cta-due:active { transform: scale(.98); }
@keyframes glow { 0%, 100% { box-shadow: 0 10px 28px var(--gold-glow), 0 2px 6px rgba(120,60,10,.2); } 50% { box-shadow: 0 14px 44px var(--gold-glow), 0 2px 6px rgba(120,60,10,.2); } }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 8px 6px 0; }
.sec-head h2 { font-size: 22px; }

/* levels */
.levels { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 5px; border-radius: 22px; background: var(--glass-soft); box-shadow: inset 0 0 0 1px var(--line); }
.lv { border: 0; border-radius: 17px; background: transparent; padding: 9px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0;
  font: 800 15px var(--font-display); color: var(--muted); transition: background-color .3s var(--ease), color .3s var(--ease); }
.lv .mini { width: 70%; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.lv .mini i { display: block; height: 100%; background: linear-gradient(90deg, var(--der), var(--das)); border-radius: 4px; }
.lv[aria-pressed="true"] { background: var(--glass-strong); color: var(--ink); box-shadow: var(--shadow); }
.lv-wide { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
.lv-wide .lv { font-size: 14px; }
.lv-wide .lv span { font: 500 11px var(--font-ui); color: var(--muted); }
.level-desc { margin: 0 6px; }

/* lesson list */
.units { padding: 6px; display: flex; flex-direction: column; }
.unit { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; padding: 12px; border-radius: 18px; text-decoration: none; transition: background-color .25s var(--ease), transform .35s var(--spring); }
.unit:hover { background: var(--glass-soft); }
.unit:active { transform: scale(.985); }
.unit .n { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 800 16px var(--font-display); background: var(--glass-strong); box-shadow: var(--shadow); }
.unit.done .n { background: var(--solid); color: var(--on-solid); }
.unit.next .n { background: conic-gradient(var(--der), var(--die), var(--das), var(--der)); color: #fff; box-shadow: 0 0 18px var(--der-glow); }
.unit .t { font: 700 16px/1.25 var(--font-display); letter-spacing: -0.01em; }
.unit .sub { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.dots { display: flex; gap: 5px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--ok); box-shadow: 0 0 6px var(--das-glow); }

/* word packs */
.packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: var(--gap); }
.pack { min-height: 118px; text-decoration: none; justify-content: space-between; transition: transform .4s var(--spring), box-shadow .4s var(--ease); }
.pack:hover { box-shadow: var(--shadow-lift); }
.pack:active { transform: scale(.97); }
.pack .pane-big { font: 700 16px/1.25 var(--font-display); letter-spacing: -0.01em; }
.pack .count { font-size: 12.5px; color: var(--muted); }
.pack.done .count { color: var(--ok); font-weight: 600; }

/* ---------- unit / pack page ---------- */
.back { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--muted); font: 600 14px var(--font-display); }
.back:hover { color: var(--ink); }
.page-head { display: flex; flex-direction: column; gap: 6px; margin: 4px 6px 0; }
.step { display: flex; flex-direction: column; gap: 14px; }
.step-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.step-head h2 { display: flex; align-items: center; gap: 12px; }
.check { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--glass-strong); box-shadow: var(--shadow); font: 800 14px var(--font-display); color: var(--muted); }
.check.on { background: var(--solid); color: var(--on-solid); }
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.word { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; padding: 12px 12px 12px 14px; border-radius: 18px; background: var(--glass-soft); box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
.word > div { min-width: 0; }
.word .wd { font-size: 17px; overflow-wrap: anywhere; }
.word .pl { font-size: 12px; color: var(--muted); }
.word .ru { font-size: 14px; margin-top: 2px; }
.word .st { margin-top: 6px; display: inline-block; }
.rule-links { display: flex; flex-direction: column; gap: 8px; }
.rule-link { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; background: var(--glass-soft); box-shadow: inset 0 0 0 1px var(--line); text-decoration: none; transition: background-color .25s var(--ease), transform .35s var(--spring); }
.rule-link:hover { background: var(--glass-strong); }
.rule-link:active { transform: scale(.985); }
.rule-link b { font: 700 15px/1.3 var(--font-display); }
.pill { font: 700 12px var(--font-display); padding: 4px 11px; border-radius: 999px; background: var(--glass-strong); white-space: nowrap; color: var(--muted); }
.pill.ok { background: var(--solid); color: var(--on-solid); }

/* ---------- rule page ---------- */
.rule-body { display: flex; flex-direction: column; gap: 12px; }
.rule-body > * { max-width: 70ch; }
.rule-body ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 5px; }
.rule-body i { font-style: normal; font-family: var(--font-display); font-weight: 600; }
.rule-body b { font-weight: 700; }
.rule-body ol { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 8px; }
.rule-body .gd-key { padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--der) 12%, transparent); box-shadow: inset 3px 0 0 var(--der); }
.guide-body .tbl th, .guide-body .tbl td { white-space: normal; }
@media (max-width: 520px) { .guide-body .tbl th, .guide-body .tbl td { padding: 8px 8px; font-size: 13px; overflow-wrap: break-word; } .guide-body .tbl th { font-size: 10px; } }
a.lv { text-decoration: none; color: inherit; }
[id^="gd-lvl-"] { scroll-margin-top: 96px; }
.tbl { overflow-x: auto; max-width: 100% !important; border-radius: 16px; background: var(--glass-soft); box-shadow: inset 0 0 0 1px var(--line); }
.rule-body table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
.rule-body th, .rule-body td { padding: 9px 12px; text-align: left; vertical-align: top; border-top: 1px solid var(--line); }
.rule-body tr:first-child th, .rule-body tr:first-child td { border-top: 0; }
.rule-body th { font: 700 11px var(--font-display); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.quiz { display: flex; flex-direction: column; gap: 10px; }
.qitem { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 18px; background: var(--glass-soft); box-shadow: inset 0 0 0 1px var(--line); }
.qtext { font: 600 18px/1.35 var(--font-display); }
.blank { display: inline-block; min-width: 3em; padding: 0 6px; border-radius: 8px; background: var(--glass-strong); text-align: center; color: var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 0; border-radius: 999px; background: var(--glass-strong); box-shadow: var(--shadow); padding: 10px 16px; min-height: 44px; font: 600 16px var(--font-display);
  transition: transform .35s var(--spring), background-color .3s var(--ease), box-shadow .3s var(--ease); }
.opt:hover:not(:disabled) { box-shadow: var(--shadow-lift); }
.opt:active:not(:disabled) { transform: scale(.95); }
.opt.right { background: var(--ok); color: #fff; box-shadow: 0 8px 22px var(--das-glow); }
.opt.wrong { background: var(--bad); color: #fff; box-shadow: 0 8px 22px var(--die-glow); }
.opt:disabled { cursor: default; }
.opt kbd { font: 600 11px var(--font-ui); color: var(--faint); margin-right: 8px; }
.opt.right kbd, .opt.wrong kbd { color: rgba(255,255,255,.75); }

/* ---------- session ---------- */
.session { max-width: 640px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.s-top { display: flex; align-items: center; gap: 12px; }
.s-top .icon-btn { width: 40px; height: 40px; }
.track { flex: 1; height: 10px; border-radius: 10px; background: var(--glass-soft); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--der), var(--die), var(--das)); transition: width .5s var(--ease); }
.s-count { font: 700 13px var(--font-display); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.card { padding: 28px 22px; display: flex; flex-direction: column; gap: 20px; animation: pop .45s var(--spring) both; }
@keyframes pop { from { transform: translateY(10px) scale(.985); opacity: .3; } }
.prompt { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.prompt .huge { font: 800 clamp(34px, 8vw, 52px)/1.02 var(--font-display); letter-spacing: -0.035em; overflow-wrap: anywhere; }
.prompt .ru-big { font: 700 clamp(22px, 5vw, 28px)/1.25 var(--font-display); letter-spacing: -0.02em; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.choices .opt { border-radius: 18px; text-align: left; padding: 14px 16px; font-size: 17px; }
.arts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.arts .opt { border-radius: 22px; font-size: 26px; font-weight: 800; padding: 20px 6px; text-align: center; }
.arts .o-der { color: var(--der); box-shadow: var(--shadow), inset 0 0 0 2px color-mix(in srgb, var(--der) 30%, transparent); }
.arts .o-die { color: var(--die); box-shadow: var(--shadow), inset 0 0 0 2px color-mix(in srgb, var(--die) 30%, transparent); }
.arts .o-das { color: var(--das); box-shadow: var(--shadow), inset 0 0 0 2px color-mix(in srgb, var(--das) 30%, transparent); }
.arts .opt.right, .arts .opt.wrong { color: #fff; }
.type-row { display: flex; gap: 8px; }
.type-row input { flex: 1; min-width: 0; font: 700 20px var(--font-display); padding: 14px 16px; border-radius: 18px; }
.umlauts { display: flex; gap: 6px; flex-wrap: wrap; }
.umlauts button { border: 0; border-radius: 12px; min-width: 42px; min-height: 40px; background: var(--glass-strong); box-shadow: var(--shadow); font: 700 17px var(--font-display); transition: transform .3s var(--spring); }
.umlauts button:active { transform: scale(.9); }
.fb { border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.fb.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); }
.fb.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); }
.fb .verdict { font: 800 16px var(--font-display); }
.fb.ok .verdict { color: var(--ok); } .fb.bad .verdict { color: var(--bad); }
.fb .answer { font: 800 22px/1.25 var(--font-display); letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.s-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.done-title { font-size: clamp(30px, 7vw, 42px); }
.done-score { font-size: 64px; line-height: .9; }

/* sentence builder */
.line { min-height: 70px; padding: 12px; border-radius: 20px; background: var(--glass-soft); box-shadow: inset 0 0 0 1.5px var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.line.filled { background: var(--glass); }
.line .ph { color: var(--faint); font-size: 14px; padding: 0 6px; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; }
.chip { border: 0; border-radius: 14px; background: var(--glass-strong); box-shadow: var(--shadow); padding: 9px 14px; font: 700 17px var(--font-display); transition: transform .35s var(--spring), box-shadow .3s var(--ease); }
.chip:hover { box-shadow: var(--shadow-lift); }
.chip:active { transform: scale(.92); }
.line .chip { background: var(--solid); color: var(--on-solid); }
.punct { font: 800 20px var(--font-display); }

/* ---------- lists ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar input { flex: 1 1 220px; min-width: 0; }
.dict { padding: 6px; }
.drow { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 16px; }
.drow:hover { background: var(--glass-soft); }
.drow .wd { font-size: 16px; overflow-wrap: anywhere; }
.drow .pl { font-size: 12px; color: var(--muted); }
.st { font: 700 11px var(--font-display); padding: 3px 9px; border-radius: 999px; background: var(--glass-soft); color: var(--muted); white-space: nowrap; }
.st.l { background: color-mix(in srgb, var(--gold) 26%, transparent); color: var(--ink); }
.st.k { background: var(--ok); color: #fff; }
.lvl-head { display: flex; align-items: baseline; gap: 10px; margin: 6px 6px 0; font: 800 22px var(--font-display); letter-spacing: -0.02em; }
.lvl-head span { font: 500 13px var(--font-ui); color: var(--muted); letter-spacing: 0; }
.legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.legend > div { display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 18px; background: var(--glass-soft); box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; }
.legend b { font: 800 22px var(--font-display); }
.empty { text-align: center; padding: 32px 18px; color: var(--muted); display: flex; flex-direction: column; gap: 14px; align-items: center; }
.confirm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---------- nav: a floating frosted bar ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; pointer-events: none;
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.nav-in { pointer-events: auto; max-width: 620px; margin: 0 auto; height: var(--nav-h); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; gap: 2px; padding: 0 6px;
  border-radius: 999px; background: var(--bg-72); -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%); box-shadow: var(--shadow-lift); }
.navbtn { position: relative; min-width: 0; height: 54px; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font: 700 11px var(--font-display); letter-spacing: -0.01em; color: var(--muted); text-decoration: none; white-space: nowrap; transition: color .3s var(--ease), background-color .3s var(--ease); }
.navbtn svg { width: 22px; height: 22px; }
@media (max-width: 440px) { .nav-in { padding: 0 4px; gap: 0; } .navbtn { font-size: 10.5px; } }
@media (max-width: 340px) { .navbtn { font-size: 9.5px; letter-spacing: -0.02em; } }
.navbtn[aria-current="page"] { color: var(--ink); background: var(--glass-strong); }
/* Переключатель внутри вкладки: «Правила | Шпаргалки», «Словарь | Переводчик». */
.subnav { display: flex; gap: 6px; padding: 5px; border-radius: 999px; background: var(--glass-soft); box-shadow: inset 0 0 0 1px var(--line); align-self: flex-start; max-width: 100%; }
.subnav a { flex: 1 1 auto; text-align: center; text-decoration: none; padding: 9px 18px; border-radius: 999px; font: 700 14px var(--font-display); color: var(--muted); white-space: nowrap; transition: background-color .3s var(--ease), color .3s var(--ease); }
.subnav a[aria-current="page"] { background: var(--solid); color: var(--on-solid); }
.how-to { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--gold); color: #2A1704;
  font: 800 10.5px/18px var(--font-display); text-align: center; box-shadow: 0 0 10px var(--gold-glow); }

/* ---------- practice ---------- */
a.pane { text-decoration: none; }
.pane.link { transition: transform .4s var(--spring), box-shadow .4s var(--ease); }
.pane.link:hover { box-shadow: var(--shadow-lift); }
.pane.link:active { transform: scale(.97); }
.hub-card { min-height: 128px; }
.hub-dot { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 14px currentColor; }
.seg2 { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-t { border: 0; border-radius: 999px; background: var(--glass-soft); box-shadow: inset 0 0 0 1px var(--line); padding: 9px 15px; font: 700 14px var(--font-display); transition: background-color .3s var(--ease), transform .35s var(--spring); }
.chip-t:active { transform: scale(.95); }
.chip-t[aria-pressed="true"] { background: var(--solid); color: var(--on-solid); box-shadow: none; }
.chip-t .cnt { font-weight: 600; opacity: .55; margin-left: 2px; font-variant-numeric: tabular-nums; }
.pos { font-weight: 700; color: var(--faint); }
.toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--der); }
textarea.import, .composer-row textarea { width: 100%; border: 0; border-radius: 16px; background: var(--glass-soft); box-shadow: inset 0 0 0 1px var(--line); padding: 12px 14px; color: var(--ink); font: 500 15px/1.5 var(--font-ui); resize: vertical; }
textarea.import:focus { outline: none; background: var(--glass-strong); box-shadow: inset 0 0 0 1.5px var(--der), 0 0 0 4px var(--der-glow); }
.dw-ok { color: var(--ok); } .dw-bad { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 4px; }
details summary { cursor: pointer; font-weight: 600; }
details.verb { padding: 10px 12px; border-radius: 16px; }
details.verb summary { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; list-style: none; }
details.verb[open] { background: var(--glass-soft); }
details.verb .tbl { margin-top: 10px; }
.tbl table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
.tbl th, .tbl td { padding: 8px 12px; text-align: left; border-top: 1px solid var(--line); white-space: nowrap; }
.tbl tr:first-child th { border-top: 0; font: 700 11px var(--font-display); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.wall4 { grid-template-columns: repeat(4, 1fr); }
.wall4 .pane { min-height: 104px; }
.chart { width: 100%; height: auto; display: block; }
.chart .gbar { fill: var(--der); opacity: .55; }
.chart .gbar.hit { fill: var(--gold); opacity: 1; }
.chart .goal { stroke: var(--faint); stroke-dasharray: 4 5; stroke-width: 1.5; }
.chart text { fill: var(--muted); font: 600 11px var(--font-display); }
.lvrow { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; }
.meter { position: relative; height: 10px; border-radius: 10px; background: var(--glass-soft); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 10px; }
.meter .m-s { background: var(--der-glow); }
.meter .m-k { background: linear-gradient(90deg, var(--der), var(--das)); }
/* reading */
.reader .text { display: flex; flex-direction: column; gap: 14px; font: 500 19px/1.75 var(--font-ui); max-width: 68ch; }
.tw { border: 0; background: none; padding: 0 1px; margin: 0; font: inherit; color: inherit; border-radius: 6px; cursor: pointer; }
.tw:hover { background: var(--der-glow); }
.lookup { position: fixed; z-index: 7; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 22px + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100% - 28px));
  display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 22px;
  background: var(--bg-86); -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%); box-shadow: var(--shadow-lift); animation: pop .35s var(--spring) both; }
.lookup .wd { font-size: 20px; }
.gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 16px; font-size: 14px; }
.gloss div { display: flex; flex-direction: column; padding: 6px 0; border-top: 1px solid var(--line); }
.gloss span { color: var(--muted); }
/* exam */
.exam-text { padding: 16px 18px; border-radius: 18px; background: var(--glass-soft); box-shadow: inset 0 0 0 1px var(--line); font: 500 16px/1.65 var(--font-ui); white-space: normal; }
hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.opt.sel { background: var(--solid); color: var(--on-solid); }
/* tutor */
.chat { display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; }
.bubble-ai, .bubble-me { max-width: 86%; padding: 12px 16px; font: 500 16px/1.5 var(--font-ui); overflow-wrap: anywhere; }
.bubble-ai p, .bubble-me p { margin: 0; }
.bubble-ai { align-self: flex-start; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--shadow); border-radius: 22px 22px 22px 6px; display: flex; flex-direction: column; gap: 8px; }
.bubble-me { align-self: flex-end; background: var(--solid); color: var(--on-solid); border-radius: 22px 22px 6px 22px; }
.chat > :last-child:not(#chatEnd), .chat > .bubble-ai:nth-last-child(2) { animation: pop .45s var(--spring) both; }
.corr { align-self: flex-end; max-width: 86%; display: flex; flex-direction: column; gap: 8px; padding: 10px 14px; border-radius: 16px; background: color-mix(in srgb, var(--bad) 12%, transparent); font-size: 13.5px; }
.corr.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); font-weight: 600; }
.typing { flex-direction: row; gap: 5px; padding: 16px; }
.typing span { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
.composer { position: sticky; bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom, 0px)); z-index: 4; display: flex; flex-direction: column; gap: 8px; }
.composer-row { display: flex; align-items: flex-end; gap: 8px; padding: 6px; border-radius: 26px; background: var(--bg-86); -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%); box-shadow: var(--shadow-lift); }
.composer-row textarea { flex: 1; min-width: 0; resize: none; box-shadow: none; background: transparent; max-height: 140px; }
.composer-row input { flex: 1; min-width: 0; box-shadow: none; background: transparent; border: 0; padding: 10px 12px; font: 600 17px var(--font-ui); color: var(--ink); }
/* dialogs */
.dlg-form { gap: 8px; scroll-margin-bottom: calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.dlg-task { padding: 14px 16px; gap: 6px; }
.dlg-tpl { padding: 8px 12px; border-radius: 12px; background: var(--glass-soft); box-shadow: inset 0 0 0 1px var(--line); font: 600 15px/1.45 var(--font-ui); }
.dlg-tr summary { cursor: pointer; font-size: 12.5px; color: var(--muted); list-style: none; }
.dlg-tr summary::-webkit-details-marker { display: none; }
.dlg-tr span { display: block; margin-top: 4px; font-size: 14px; color: var(--muted); }

/* sentence builder with hints */
.sb-scheme { display: flex; flex-wrap: wrap; gap: 6px; }
.sb-box { --rc: var(--muted); min-width: 58px; padding: 6px 10px 8px; border-radius: 14px; background: var(--glass-soft); box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column; gap: 2px; transition: background-color .3s var(--ease), box-shadow .3s var(--ease); }
.sb-box small { font: 700 10.5px/1.2 var(--font-display); color: var(--rc); letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }
.sb-box span { font: 700 17px/1.3 var(--font-display); }
.sb-box.z { min-width: 0; padding-inline: 8px; }
.sb-box.on { background: color-mix(in srgb, var(--rc) 15%, transparent); box-shadow: none; }
.sb-box.cur { box-shadow: inset 0 0 0 2px var(--rc), 0 0 0 4px color-mix(in srgb, var(--rc) 18%, transparent); }
.r-s, .r-q, .r-c { --rc: var(--der); } .r-v, .r-e, .r-f { --rc: var(--die); } .r-o, .r-d, .r-p { --rc: var(--das); }
.r-t, .r-k, .r-m, .r-n { --rc: var(--gold); } .r-z, .r-r { --rc: var(--muted); }
.sb-hint { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--rc) 11%, transparent); box-shadow: inset 3px 0 0 var(--rc); font-size: 14.5px; }
.sb-hint .eyebrow { color: var(--rc); }
.sb-warn { margin-top: 4px; padding: 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--bad) 13%, transparent); color: var(--ink); font-size: 14px; }
.sb-notes { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.sb-rule summary { font: 700 15px var(--font-display); }
.sb-rule-inline { border-radius: 18px; background: var(--glass-soft); box-shadow: inset 0 0 0 1px var(--line); }
.sb-rule-inline summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; list-style: none; font-weight: 400; }
.sb-rule-inline summary::-webkit-details-marker { display: none; }
.sb-rule-inline summary b { font: 700 15px/1.3 var(--font-display); }
.sb-rule-inline[open] summary .pill { background: var(--solid); color: var(--on-solid); }
.sb-rule-inline .rule-body { padding: 4px 16px 12px; font-size: 14.5px; }
.sb-rule-inline > .btn { margin: 0 16px 14px; }
.sb-back { align-self: flex-start; }
.sb-rule p { margin-top: 8px; }
.sb-rule:not([open]) { padding-block: 14px; }

/* AI explanation sheet */
.why { color: var(--der); }
.ai-sheet { position: fixed; z-index: 8; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 22px + env(safe-area-inset-bottom, 0px)); width: min(600px, calc(100% - 28px));
  max-height: 60vh; overflow-y: auto; padding: 16px 18px 18px; border-radius: 24px; background: var(--bg-86);
  -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%); box-shadow: var(--shadow-lift); animation: pop .35s var(--spring) both; }
.ai-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.ai-body { display: flex; flex-direction: column; gap: 8px; font: 500 15px/1.6 var(--font-ui); }
.ai-body p { margin: 0; }
/* find the error */
.fe-line { gap: 8px; }
.chip.fe { background: var(--glass-strong); color: var(--ink); }
.chip.fe.err { background: var(--bad); color: #fff; }
.chip.fe.miss { box-shadow: inset 0 0 0 2px var(--faint); }
.chip.fe:disabled { cursor: default; }
/* reading: AI texts */
.ai-gen input { width: 100%; }
.rule-link-wrap { display: flex; align-items: center; gap: 8px; }
.rule-link-wrap .rule-link { flex: 1; min-width: 0; }
/* achievements */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: var(--gap); }
.ach-card { min-height: 150px; opacity: .55; filter: grayscale(.6); }
.ach-card.on { opacity: 1; filter: none; }
.ach-card b { font: 800 16px/1.25 var(--font-display); }
.ach-ico { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; font: 800 18px var(--font-display);
  background: var(--glass-strong); box-shadow: var(--shadow); }
.ach-card.on .ach-ico { background: conic-gradient(var(--der), var(--die), var(--das), var(--der)); color: #fff; box-shadow: 0 0 18px var(--der-glow); }
.ok-t { color: var(--ok); font-weight: 600; }
.toast { position: fixed; z-index: 9; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 14px); display: flex; align-items: center; gap: 12px;
  padding: 12px 18px 12px 12px; border-radius: 999px; background: var(--solid); color: var(--on-solid); box-shadow: var(--shadow-lift); font-size: 14px; animation: pop .45s var(--spring) both; max-width: calc(100% - 28px); }
.toast .ach-ico { width: 38px; height: 38px; background: conic-gradient(var(--der), var(--die), var(--das), var(--der)); color: #fff; box-shadow: none; }

/* my words form */
.form2 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.form2 label { display: flex; flex-direction: column; gap: 6px; font: 700 13px var(--font-display); color: var(--muted); min-width: 0; }
.form2 input { border: 0; border-radius: 14px; background: var(--glass-soft); box-shadow: inset 0 0 0 1px var(--line); padding: 12px 14px; min-height: 46px; color: var(--ink); font: 600 16px var(--font-ui); width: 100%; }
.form2 input:focus { outline: none; background: var(--glass-strong); box-shadow: inset 0 0 0 1.5px var(--der), 0 0 0 4px var(--der-glow); }
.drow.phrase .wd { font-size: 17px; }
/* flashcards */
.flash { min-height: 300px; border-radius: 28px; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--shadow-lift);
  display: grid; place-items: center; padding: 28px 22px; cursor: pointer; touch-action: pan-y; user-select: none; text-align: center; transition: transform .35s var(--spring), background-color .3s var(--ease); }

    if (Date.now() - openedAt < FRESH_MS) location.reload(); else reloadPending = true;
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      document.addEventListener('visibilitychange', () => {

      });
    }).catch(() => {});
  });
}
